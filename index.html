<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#216b65"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>课时管家</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#243449;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:22px}h1{margin:0;color:#214e56}small{color:#637181}section,article{background:white;border:1px solid #dce4e9;border-radius:15px;padding:18px;margin:14px 0}button,input,select{font:inherit;padding:10px;border:1px solid #cbd5db;border-radius:8px}button{background:#216b65;color:white;cursor:pointer;border:0}button.alt{background:#e8f0f0;color:#24534f}button.del{background:#fff0ef;color:#a63737}form,.row{display:flex;gap:9px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px;font-size:13px;color:#536170}input,select{max-width:100%;min-width:0;background:white}form label{flex:1;min-width:125px}h2{font-size:19px;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.stats div{background:#f0f6f5;padding:12px;border-radius:9px}.stats b{display:block;font-size:26px;color:#216b65}.warn{color:#b44b23!important}progress{width:100%;accent-color:#216b65}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;border-bottom:1px solid #e5e9ed;padding:10px 5px}td button{padding:6px;font-size:12px}.scroll{overflow:auto}header{margin-bottom:18px}#msg{color:#a63737} @media(max-width:500px){main{padding:12px}section,article{padding:13px}td{white-space:nowrap}.stats b{font-size:22px}}@media(max-width:600px){main{padding:16px 14px 32px}button{min-height:44px}input,select{font-size:16px;min-height:44px}form label{min-width:100%}h1{font-size:30px}section,article{border-radius:20px}dialog{max-height:85dvh;overflow:auto}} </style><main><header><h1>课时管家</h1><small>家庭课时账本 · 本地保存 · 无需登录</small></header><div id="msg" role="alert"></div><section><h2>新增课程</h2><form id="add"><label>孩子昵称<input name="child" placeholder="孩子" required maxlength="40"></label><label>课程名称<input name="name" placeholder="例如：钢琴" required maxlength="60"></label><label>默认每次扣课<input name="unit" type="number" min="0.01" step="0.01" value="1" required></label><button>添加课程</button></form></section><div id="cards"></div><section><h2>课时流水</h2><div class="row"><label>课程<select id="filter"></select></label><label>月份<input type="month" id="month"></label><button class="alt" id="clear">全部月份</button></div><p id="summary"></p><div class="scroll"><table><thead><tr><th>日期</th><th>课程</th><th>事项</th><th>课时变化</th><th>金额</th><th>备注</th><th>操作</th></tr></thead><tbody id="ledger"></tbody></table></div></section><section><h2>数据备份</h2><div class="row"><button id="backup">备份 JSON</button><button class="alt" id="csv">导出 CSV（Excel）</button><button class="alt" id="restore">恢复备份</button><input id="file" type="file" accept=".json" hidden></div><p><small>数据保存在当前浏览器的本地存储。请定期备份；清理浏览器数据、换设备或换浏览器可能导致记录丢失。</small></p></section><dialog id="dlg"><form id="entry"><h2 id="heading"></h2><label>日期<input type="date" name="date" required></label><label>事项<select name="type"><option>上课</option><option>补课</option><option>请假</option><option>停课</option><option>购买</option><option>赠送</option><option>退课</option></select></label><label>课时数（请假或停课不扣填0）<input type="number" name="qty" min="0" step="0.01" required></label><label>支付金额（退款填负数）<input type="number" name="money" step="0.01" value="0" required></label><label>备注<input name="note" maxlength="300"></label><div class="row"><button>保存记录</button><button type="button" class="alt" id="cancel">取消</button></div></form></dialog></main><style>dialog{border:1px solid #ccd6d9;border-radius:16px;width:min(390px,94vw);padding:22px}dialog form{display:grid}dialog::backdrop{background:#102b3655}</style><script>
const $=id=>document.getElementById(id),key='lesson-ledger-v1';let db={courses:[],entries:[]},cid='',eid='';try{let s=localStorage.getItem(key);if(s)db=JSON.parse(s)}catch(e){$('msg').textContent='无法读取本地数据，请恢复备份。'}const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},num=n=>Math.round(n*100)/100,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),positive=t=>['购买','赠送'].includes(t),delta=e=>positive(e.type)?e.qty:-e.qty,course=x=>db.courses.find(c=>c.id===x);function save(){try{localStorage.setItem(key,JSON.stringify(db));$('msg').textContent=''}catch(e){$('msg').textContent='本地保存失败，请立即导出备份。'}render()}function render(){let f=$('filter').value;$('filter').innerHTML='<option value="">全部课程</option>'+db.courses.map(c=>`<option value="${esc(c.id)}">${esc(c.child)} · ${esc(c.name)}</option>`).join('');$('filter').value=f;$('cards').innerHTML=db.courses.length?db.courses.map(c=>{let es=db.entries.filter(e=>e.cid===c.id),buy=num(es.filter(e=>positive(e.type)).reduce((s,e)=>s+e.qty,0)),used=num(es.filter(e=>!positive(e.type)&&e.type!=='退课').reduce((s,e)=>s+e.qty,0)),left=num(es.reduce((s,e)=>s+delta(e),0)),count=es.filter(e=>['上课','补课'].includes(e.type)).length;return `<article><h2>${esc(c.name)} <small>· ${esc(c.child)}</small></h2><div class="stats"><div>累计购赠<b>${buy}</b></div><div>已消耗<b>${used}</b></div><div>剩余<b class="${left<=3?'warn':''}">${left}</b></div></div><progress max="${buy||1}" value="${Math.max(0,Math.min(buy,used))}"></progress><p><small>实际到课 ${count} 次 · 请假 ${es.filter(e=>e.type==='请假').length} 次 · 净支付 ¥${num(es.reduce((s,e)=>s+e.money,0))}${left<=3?' · 课时不足提醒':''}</small></p><div class="row">${['上课','请假','补课','购买','停课','赠送','退课'].map(t=>`<button class="${t==='上课'?'':'alt'}" data-c="${esc(c.id)}" data-t="${t}">${t==='购买'?'购买/续费':t}</button>`).join('')}</div></article>`}).join(''):'<section>还没有课程。先添加课程，再登记购买课时。</section>';let es=db.entries.filter(e=>(!$('filter').value||e.cid===$('filter').value)&&(!$('month').value||e.date.startsWith($('month').value))).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));$('summary').textContent=`共 ${es.length} 条记录 · 到课 ${es.filter(e=>['上课','补课'].includes(e.type)).length} 次 · 消耗 ${num(es.filter(e=>!positive(e.type)&&e.type!=='退课').reduce((s,e)=>s+e.qty,0))} 课时`;$('ledger').innerHTML=es.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(course(e.cid)?.name)}</td><td>${esc(e.type)}</td><td>${delta(e)>0?'+':''}${delta(e)}</td><td>${e.money}</td><td>${esc(e.note)}</td><td><button class="alt" data-edit="${esc(e.id)}">修改</button> <button class="del" data-del="${esc(e.id)}">删除</button></td></tr>`).join('')||'<tr><td colspan="7">暂无记录</td></tr>'}function open(c,t,e){cid=c;eid=e?.id||'';let f=$('entry');f.reset();$('heading').textContent=course(c).name+' · '+(e?'修改记录':t);f.date.value=e?.date||today();f.type.value=t;f.qty.value=e?.qty??(['请假','停课'].includes(t)?0:course(c).unit);f.money.value=e?.money??0;f.note.value=e?.note||'';$('dlg').showModal()}$('add').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.courses.push({id:id(),child:f.get('child').trim(),name:f.get('name').trim(),unit:Number(f.get('unit'))});e.target.reset();save()};$('entry').type.onchange=()=>{$('entry').qty.value=['请假','停课'].includes($('entry').type.value)?0:course(cid).unit};$('entry').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),r={id:eid||id(),cid,date:f.get('date'),type:f.get('type'),qty:Number(f.get('qty')),money:Number(f.get('money')),note:f.get('note')};if(r.qty===0&&!['请假','停课'].includes(r.type)){alert('请填写大于0的课时');return}let left=num(db.entries.filter(x=>x.cid===cid&&x.id!==eid).reduce((s,x)=>s+delta(x),0)+delta(r));if(left<0&&!confirm('记录后余额为负数，仍然保存吗？'))return;if(!eid&&db.entries.some(x=>x.cid===cid&&x.date===r.date&&x.type===r.type)&&!confirm('同一天已有同类记录，确认再记一次？'))return;db.entries=db.entries.filter(x=>x.id!==eid);db.entries.push(r);$('dlg').close();save()};$('cancel').onclick=()=>$('dlg').close();document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.c)open(d.c,d.t);if(d.edit){let x=db.entries.find(x=>x.id===d.edit);open(x.cid,x.type,x)}if(d.del&&confirm('删除此记录并重新计算余额？')){db.entries=db.entries.filter(x=>x.id!==d.del);save()}});$('filter').onchange=render;$('month').onchange=render;$('clear').onclick=()=>{$('month').value='';render()};function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('backup').onclick=()=>download('课时备份-'+today()+'.json',JSON.stringify(db,null,2),'application/json');$('csv').onclick=()=>{let q=x=>'"'+String(x??'').replace(/^[=+@-](?=\D)/,"'$&").replaceAll('"','""')+'"';download('课时流水.csv','\ufeff'+[['日期','孩子','课程','事项','课时变化','金额','备注'],...db.entries.map(e=>[e.date,course(e.cid)?.child,course(e.cid)?.name,e.type,delta(e),e.money,e.note])].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.courses)||!Array.isArray(v.entries)||!v.courses.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&typeof c.child==='string'&&Number.isFinite(c.unit)&&c.unit>0)||new Set(v.courses.map(c=>c.id)).size!==v.courses.length||!v.entries.every(r=>typeof r.id==='string'&&v.courses.some(c=>c.id===r.cid)&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&['上课','补课','请假','停课','购买','赠送','退课'].includes(r.type)&&Number.isFinite(r.qty)&&r.qty>=0&&Number.isFinite(r.money))||new Set(v.entries.map(r=>r.id)).size!==v.entries.length)throw Error();if(confirm('恢复将替换当前全部数据，确认继续？')){db=v;save()}}catch(x){alert('备份文件无效或读取失败')}e.target.value=''};render();</script><script>if("serviceWorker" in navigator && location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(console.warn);</script></html>
